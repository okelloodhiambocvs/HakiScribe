# Render Blueprint for HakiScribe-AI (full-stack: API + frontend + WebSocket).
# FREE PLAN: no persistent disk. /tmp is ephemeral - the database, uploads,
# and generated documents are LOST on restart, redeploy, or instance
# replacement. Free instances also sleep after inactivity (slow cold start).
# Demo use only: never treat this as permanent storage for official records.
services:
  - type: web
    name: hakiscribe-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/audit/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HAKISCRIBE_DB_PATH
        value: /tmp/hakiscribe.db
      - key: STORAGE_DIR
        value: /tmp/storage
      - key: META_API_BASE
        value: https://api.meta.ai/v1
      - key: META_VOICE_MODEL
        value: muse-voice-transcribe-1.0
      - key: META_SPARK_MODEL
        value: muse-spark-1.3
      - key: META_WONDER_MODEL
        value: muse-wonder-1.0
      # Paste your Meta Model API key in the Render dashboard (never in git).
      - key: META_API_KEY
        sync: false
