# Render Blueprint for HakiScribe-AI (full-stack: API + frontend + WebSocket).
# NOTE: persistent disks require a paid instance type (Starter or higher).
# Deploying on Free leaves the filesystem ephemeral (DB/uploads reset on restart).
services:
  - type: web
    name: hakiscribe-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/audit/health
    disk:
      name: hakiscribe-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HAKISCRIBE_DB_PATH
        value: /data/hakiscribe.db
      - key: STORAGE_DIR
        value: /data/storage
      - key: META_API_BASE
        value: https://api.meta.ai/v1
      - key: META_VOICE_MODEL
        value: muse-voice-transcribe-1.0
      - key: META_SPARK_MODEL
        value: muse-spark-1.3
      - key: META_WONDER_MODEL
        value: muse-wonder-1.0
      # Paste your Meta Model API key in the Render dashboard (never in git).
      - key: META_API_KEY
        sync: false
